---
- name: "Nessus"
  block:
    - name: Install Nessus agent
      become: true
      apt:
        deb: "https://www.tenable.com/downloads/api/v1/public/pages/nessus-agents/downloads/17242/download?i_agree_to_tenable_license_agreement=true"

    - name: Check link status
      shell: /opt/nessus_agent/sbin/nessuscli agent status; true
      register: nessus_link_status

    - name: Check Nessus Agent Service Status
      shell: service nessusagent status; true
      register: nessus_agent_service_status


    - name: Link nessus agent to tenable
      shell: /opt/nessus_agent/sbin/nessuscli agent link --host="cloud.tenable.com" --port="443" --key="<NESSUS_AGENT_KEY>" --groups="COMPANY-PROD-CLOUD"
      when: "'Linked to: cloud.tenable.com' not in nessus_link_status.stdout"

    - name: Starting Nessus Agent service
      command: service nessusagent start
      when: "('Linked to: cloud.tenable.com' not in nessus_link_status.stdout) and ('active (running)' not in nessus_agent_service_status.stdout)"
