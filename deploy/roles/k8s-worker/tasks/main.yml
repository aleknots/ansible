---
# ------------------------------------------------------------------------------
# Role Tasks: k8s-worker (Joining Worker Nodes to Cluster)
# ------------------------------------------------------------------------------
- name: Check if Worker node has already joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Execute kubeadm join on Worker node
  ansible.builtin.command: "{{ hostvars[groups['master'][0]]['join_command'] }}"
  when: not kubelet_conf.stat.exists

- name: Label Worker node in Kubernetes cluster
  ansible.builtin.command: >
    kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/worker=worker --overwrite
  delegate_to: "{{ groups['master'][0] }}"
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  changed_when: false
